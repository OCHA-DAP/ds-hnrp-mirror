name: Deploy explorer site

# The site data (site/data/**) is exported from the dev DB by the Databricks
# job in databricks.yml, which parks it on the dev blob; this workflow only
# copies it down and deploys. GitHub runners no longer talk to the DB (it is
# reachable only through its private endpoint).

on:
  schedule:
    - cron: "0 8 * * *" # daily, after the Databricks refresh (04:17 UTC) has landed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --no-sources -e .
      - name: Fetch site data from blob
        env:
          DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          test -n "$DSCI_AZ_BLOB_DEV_SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          uv run --no-sync python scripts/site_data_blob.py download
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
