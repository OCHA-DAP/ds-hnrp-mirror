# Databricks Asset Bundle — ds-hnrp-mirror
#
# Two jobs:
#
#   • hnrp_mirror — the daily chain (replaces refresh-hnrp.yml's daily cron and
#     the DB half of deploy-site.yml):
#         refresh_hpc          scripts/refresh_hpc.py          → hpc.plans, hpc.caseloads
#         refresh_needs        scripts/refresh_needs.py        → hpc.needs_admin      (after hpc)
#         refresh_jiaf         scripts/refresh_jiaf.py         → hpc.severity/pin     (after hpc)
#         refresh_monitoring   scripts/refresh_monitoring.py   → hpc.monitoring_*     (after hpc)
#         export_site          scripts/export_site_data.py     → site/data/**
#         publish_site_data    scripts/site_data_blob.py upload → dev blob projects/ds-hnrp-mirror/site-data/
#     The GitHub Pages deploy (deploy-site.yml, 08:00 UTC) copies site-data down.
#   • hnrp_mirror_backfill — Sundays, refresh_hpc.py --all (full history).
#
# Every task runs the unchanged pure-Python script through the thin wrapper
# databricks/run_task.py, which sets STAGE (the ocha-stratus data plane) and
# copies src/ + scripts/ onto local disk before running. Credentials are not
# in this file: the Job Compute policy injects DSCI_AZ_* from the `dsci`
# secret scope.
#
# Extra secrets (not in the policy) that must exist in the dsci scope before
# the first deploy: HAPI_APP_IDENTIFIER.
#
# Data plane: this mirror lives on the DEV DB (+ dev blob) by design, so the
# prod TARGET (= the live schedule, ephemeral Job Compute) still runs with
# stage=dev. The two axes are independent (KB infrastructure/databricks.md).
#
#   databricks bundle validate -t prod -p DEFAULT
#   databricks bundle deploy   -t prod -p DEFAULT                          # the live job(s)
#   databricks bundle run hnrp_mirror -t prod -p DEFAULT              # manual run
#   databricks bundle deploy   -t dev  -p DEFAULT --var git_branch=my-branch   # feature test (paused)
#   databricks bundle destroy  -t dev  -p DEFAULT
#
# Code changes ship by pushing the branch (source: GIT); `bundle deploy` is
# only needed when the job config (schedule, params, libraries) changes.

bundle:
  name: ds-hnrp-mirror

variables:
  git_branch:
    description: Repo branch the jobs pull the code from
    default: main
  stage:
    description: ocha-stratus data plane the scripts read/write (dev | prod) — this mirror is dev
    default: dev

.git_source: &git_source
  git_url: https://github.com/OCHA-DAP/ds-hnrp-mirror.git
  git_provider: gitHub
  git_branch: ${var.git_branch}

# Job Compute policy (000C79D951EAF0D6): ephemeral single-worker cluster that
# injects DSCI_AZ_DB_*/DSCI_AZ_BLOB_* (dev + prod) from the dsci secret scope.
.cluster_spec: &cluster_spec
  policy_id: "000C79D951EAF0D6"
  apply_policy_default_values: true
  num_workers: 1
  spark_env_vars:
    HAPI_APP_IDENTIFIER: "{{secrets/dsci/HAPI_APP_IDENTIFIER}}"

# pyproject [project.dependencies]; pandas/pyarrow/requests come with the runtime.
.libs: &libs
  - pypi: { package: "ocha-stratus>=0.1.7" }
  - pypi: { package: "python-dotenv" }
  - pypi: { package: "openpyxl" }
  - pypi: { package: "psycopg2-binary" }
  - pypi: { package: "sqlalchemy>=2.0" }
  - pypi: { package: "pyarrow" }

resources:
  jobs:

    hnrp_mirror:
      name: HNRP Mirror
      description: >
        Daily HNRP/PiN mirror into the dev `hpc` schema (HPC plans + caseloads + FTS funding, then admin-level PiN, JIAF severity and subnational monitoring in parallel), followed by the site-data export to the dev blob for the GitHub Pages explorer.
      git_source: *git_source
      tags:
        databricks: job
        output_schema: hpc

      permissions:
        - group_name: dsci
          level: CAN_MANAGE

      schedule:
        # 04:17 UTC daily (the old GitHub Actions cron). No explicit pause_status: the prod target runs it,
        # the dev target (development mode) auto-pauses it.
        quartz_cron_expression: "0 17 4 * * ?"
        timezone_id: UTC

      max_concurrent_runs: 1

      parameters:
        - name: stage
          default: ${var.stage}

      job_clusters:
        - job_cluster_key: main
          new_cluster: *cluster_spec

      tasks:
        - task_key: refresh_hpc
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/refresh_hpc.py"
              - "--stage"
              - "{{job.parameters.stage}}"
        - task_key: refresh_needs
          depends_on:
            - task_key: refresh_hpc
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/refresh_needs.py"
              - "--stage"
              - "{{job.parameters.stage}}"
        - task_key: refresh_jiaf
          depends_on:
            - task_key: refresh_hpc
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/refresh_jiaf.py"
              - "--stage"
              - "{{job.parameters.stage}}"
        - task_key: refresh_monitoring
          depends_on:
            - task_key: refresh_hpc
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/refresh_monitoring.py"
              - "--stage"
              - "{{job.parameters.stage}}"
        - task_key: export_site
          depends_on:
            - task_key: refresh_needs
            - task_key: refresh_jiaf
            - task_key: refresh_monitoring
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/export_site_data.py"
              - "--stage"
              - "{{job.parameters.stage}}"
        - task_key: publish_site_data
          depends_on:
            - task_key: export_site
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/site_data_blob.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--"
              - "upload"

    hnrp_mirror_backfill:
      name: HNRP Mirror — weekly full backfill
      description: >
        Sunday full historical backfill of HPC plans/caseloads/funding (refresh_hpc.py --all). The daily job 90 minutes later refreshes the dependent tables and the site as usual.
      git_source: *git_source
      tags:
        databricks: job
        output_schema: hpc

      permissions:
        - group_name: dsci
          level: CAN_MANAGE

      schedule:
        # 02:47 UTC Sundays (the old weekly GitHub Actions cron). No explicit pause_status: the prod target runs it,
        # the dev target (development mode) auto-pauses it.
        quartz_cron_expression: "0 47 2 ? * SUN"
        timezone_id: UTC

      max_concurrent_runs: 1

      parameters:
        - name: stage
          default: ${var.stage}

      job_clusters:
        - job_cluster_key: main
          new_cluster: *cluster_spec

      tasks:
        - task_key: refresh_hpc_all
          job_cluster_key: main
          libraries: *libs
          spark_python_task:
            python_file: databricks/run_task.py
            source: GIT
            parameters:
              - "scripts/refresh_hpc.py"
              - "--stage"
              - "{{job.parameters.stage}}"
              - "--"
              - "--all"

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: adm.tdowning@global.un.org
